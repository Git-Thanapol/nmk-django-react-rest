# HTTP: ACME challenge for Let's Encrypt, everything else -> HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Anything not matching the domain (e.g. raw IP) -> main site. Uses the self-signed cert.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    return 301 https://www.myaccbase.com$request_uri;
}

# Apex -> www
server {
    listen 443 ssl;
    server_name myaccbase.com;

    ssl_certificate     /etc/letsencrypt/live/www.myaccbase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.myaccbase.com/privkey.pem;

    return 301 https://www.myaccbase.com$request_uri;
}

# Main site
server {
    listen 443 ssl;
    server_name www.myaccbase.com;

    ssl_certificate     /etc/letsencrypt/live/www.myaccbase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.myaccbase.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
