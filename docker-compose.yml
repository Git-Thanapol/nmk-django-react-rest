version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: nmk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nmk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmk_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - nmk_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nmk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - nmk_network
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  nmk_network:
    driver: bridge
